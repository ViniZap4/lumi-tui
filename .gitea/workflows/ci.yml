# CI do lumi-tui no Gitea (org lumi): gofmt, go vet, go test e build.
# Checkout pela variável LAN_GIT_URL (o Gitea se anuncia aos jobs como http://gitea:3000).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.11-bookworm
    timeout-minutes: 25
    env:
      GITEA_URL: ${{ vars.LAN_GIT_URL }}
      # govulncheck fixado (a versão mais nova; v1.8+ exige Go >= 1.26).
      GOVULNCHECK_VERSION: "v1.10.0"
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          [ -n "$GITEA_URL" ] || { echo "::error::defina a variável de organização LAN_GIT_URL"; exit 1; }
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git config --global "http.$GITEA_URL/.extraheader" "AUTHORIZATION: basic $auth"
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITEA_URL/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          # Base do gate de benchmarks (PRs comparam com a main).
          git fetch -q --depth 1 origin main:refs/remotes/origin/main || true
          git config --global --unset-all "http.$GITEA_URL/.extraheader"
          git log --oneline -1

      - name: gofmt
        run: |
          set -eu
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::arquivos sem gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck (bloqueante)
        # Falha em qualquer vulnerabilidade alcançável que não esteja em
        # .govulncheck-allow com data de validade ainda não vencida.
        run: |
          set -eu
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          sh scripts/govulncheck.sh ./...

      - name: go test
        run: go test -count=1 ./...

      # Gate de desempenho (docs/PERF-BUDGETS.md no guarda-chuva):
      # benchmarks do PR e da main intercalados, comparados com benchstat;
      # bloqueia regressão > 10 % significativa em sec/op ou allocs/op.
      - name: benchmarks vs main (benchstat)
        if: github.event_name == 'pull_request'
        env:
          BENCH_ROUNDS: "8"
          BENCH_TIME: "200ms"
        run: |
          set -eu
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260813145340-fd4a688df892
          BENCHSTAT="$(go env GOPATH)/bin/benchstat" scripts/bench-gate.sh origin/main

      - name: build
        run: go build -o /tmp/lumi .
